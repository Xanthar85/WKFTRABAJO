    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Fallback mínimo dentro de #root. React lo reemplaza al montar. -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0a0a0a;
        color: #e8e8e8;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #root:empty::before {
        content: "Cargando WKF…";
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #9a9a9a;
        font-size: 0.95rem;
      }

          display: flex;

          justify-content: center;
          padding: 24px;
          text-align: center;
        "
      >
        <p>WKF necesita JavaScript para funcionar. Actívalo en tu navegador.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
